version: '3'
vars:
  PRESET: '{{default "dev" .PRESET}}'
  INSTALL_BUILD_DIR: build/release
tasks:
  license-check:
    desc: Validate REUSE licensing metadata
    cmds:
    - reuse lint
  install:
    desc: Configure and install the production theme to /usr
    cmds:
    - cmake -S . -B {{.INSTALL_BUILD_DIR}} -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/usr
    - cmake --build {{.INSTALL_BUILD_DIR}}
    - sudo cmake --install {{.INSTALL_BUILD_DIR}}
  test:
    desc: test
    cmds:
    - task: build
      vars:
        PRESET: dev
    - ctest --preset dev {{.CLI_ARGS}}
  check:
    desc: Authoritative container acceptance
    cmds:
    - python3 scripts/ci/container.py check {{.CLI_ARGS}}
  test:nested:
    desc: Alias for original nested visual acceptance
    cmds:
    - task: test
  configure:
    desc: configure
    cmds:
    - cmake --preset {{.PRESET}} {{.CLI_ARGS}}
  build:
    desc: build
    cmds:
    - cmake --preset {{.PRESET}}
    - cmake --build --preset {{.PRESET}}
  configure:release:
    desc: configure:release
    cmds:
    - cmake --preset release {{.CLI_ARGS}}
  build:release:
    desc: build:release
    cmds:
    - cmake --preset release
    - cmake --build --preset release
  format:
    desc: Format with the pinned container tools
    cmds:
    - python3 scripts/ci/container.py format
  format-check:
    desc: format-check
    cmds:
    - python3 scripts/quality.py format-check
  check:integration:
    desc: Container acceptance plus Release staging and runtime checks
    cmds:
    - python3 scripts/ci/container.py integration {{.CLI_ARGS}}
